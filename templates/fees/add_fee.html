<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fee</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .page-card {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            padding: 35px;
        }

        .page-title {
            font-size: 46px;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 24px;
            font-weight: 600;
            color: #212529;
        }

        .form-control,
        .form-select {
            font-size: 22px;
            padding: 14px 18px;
            border-radius: 10px;
        }

        .btn-lg-custom {
            font-size: 28px;
            padding: 12px 40px;
            border-radius: 12px;
            font-weight: 600;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .back-btn:hover {
            background: #5c636a;
            color: white;
        }

        .save-btn {
            background: #198754;
            color: white;
        }

        .save-btn:hover {
            background: #157347;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-card">
        <h1 class="page-title">Add Fee</h1>

        <form method="POST">
            {% csrf_token %}

            <!-- Student -->
            <div class="mb-4">
                <label class="form-label">Student</label>
                <select name="student" class="form-select" required>
                    <option value="">-- Select Student --</option>
                    {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.name }} ({{ student.roll_no }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Amount -->
            <div class="mb-4">
                <label class="form-label">Amount</label>
                <input type="number"
                       name="amount"
                       class="form-control"
                       placeholder="Enter fee amount"
                       required>
            </div>

            <!-- Status -->
            <div class="mb-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select" required>
                    <option value="">-- Select Status --</option>
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>

            <!-- Date -->
            <div class="mb-4">
                <label class="form-label">Date</label>
                <input type="date"
                       name="date"
                       class="form-control"
                       required>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'fee_list' %}"
                   class="btn btn-lg-custom back-btn">
                    Back
                </a>

                <button type="submit"
                        class="btn btn-lg-custom save-btn">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
