<!-- templates/fees/add_fee.html -->

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if fee %}Edit Fee{% else %}Add Fee{% endif %}</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #dfeaf5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 64px;
            margin-bottom: 30px;
            color: #1e66f5;
        }

        label {
            display: block;
            font-size: 32px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        input, select {
            width: 100%;
            padding: 18px;
            font-size: 28px;
            border: 1px solid #cfd6df;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            color: white;
        }

        .btn-back {
            background: #6c757d;
        }

        .btn-save {
            background: #198754;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 24px;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 42px;
            }

            label {
                font-size: 22px;
            }

            input, select {
                font-size: 20px;
            }

            .btn {
                font-size: 20px;
                padding: 12px 24px;
            }

            .footer {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>{% if fee %}Edit Fee{% else %}Add Fee{% endif %}</h1>

    <form method="POST">
        {% csrf_token %}

        <!-- Student -->
        <label>Student</label>
        <select name="student" required>
            {% for student in students %}
                <option value="{{ student.id }}"
                    {% if fee and fee.student.id == student.id %}selected{% endif %}>
                    {{ student.name }}
                </option>
            {% endfor %}
        </select>

        <!-- Course -->
        <label>Course</label>
        <select name="course" required>
            <option value="">-- Select Course --</option>
            {% for course in courses %}
                <option value="{{ course.id }}"
                    {% if fee and fee.course.id == course.id %}selected{% endif %}>
                    {{ course.name }}
                </option>
            {% endfor %}
        </select>

        <!-- Total Amount -->
        <label>Total Amount</label>
        <input
            type="number"
            step="0.01"
            name="total_amount"
            placeholder="Enter total amount"
            value="{% if fee %}{{ fee.total_amount }}{% endif %}"
            required
        >

        <!-- Paid Amount -->
        <label>Paid Amount</label>
        <input
            type="number"
            step="0.01"
            name="paid_amount"
            placeholder="Enter paid amount"
            value="{% if fee %}{{ fee.paid_amount }}{% endif %}"
            required
        >

        <!-- Status -->
        <label>Status</label>
        <select name="status" required>
            <option value="">-- Select Status --</option>
            <option value="Paid"
                {% if fee and fee.status == 'Paid' %}selected{% endif %}>
                Paid
            </option>
            <option value="Pending"
                {% if fee and fee.status == 'Pending' %}selected{% endif %}>
                Pending
            </option>
            <option value="Partial"
                {% if fee and fee.status == 'Partial' %}selected{% endif %}>
                Partial
            </option>
        </select>

        <!-- Date -->
        <label>Date</label>
        <input
            type="date"
            name="date"
            value="{% if fee and fee.date %}{{ fee.date|date:'Y-m-d' }}{% endif %}"
            required
        >

        <!-- Buttons -->
        <div class="buttons">
            <a href="{% url 'fee_list' %}" class="btn btn-back">Back</a>
            <button type="submit" class="btn btn-save">
                {% if fee %}Update Fee{% else %}Save Fee{% endif %}
            </button>
        </div>
    </form>

    <div class="footer">
        © 2026 College Management System
    </div>
</div>

</body>
</html>
