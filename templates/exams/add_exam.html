<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Exam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0ea5e9, #2563eb, #1d4ed8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.95;
            font-size: 15px;
        }

        .content {
            padding: 35px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }

        input,
        select {
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background: #f8fafc;
            width: 100%;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: white;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📝 Add Exam Record</h1>
            <p>Store student exam details and marks in one place</p>
        </div>

        <div class="content">
            <form method="post">
                {% csrf_token %}

                <div class="grid">
                    <div class="field">
                        <label>Student</label>
                        <select name="student" required>
                            {% for student in students %}
                                <option value="{{ student.id }}">{{ student.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field">
                        <label>Course</label>
                        <select name="course" required>
                            {% for course in courses %}
                                <option value="{{ course.id }}">{{ course.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field full">
                        <label>Exam Type</label>
                        <input
                            type="text"
                            name="exam_type"
                            placeholder="Mid Term, Practical, Final Exam"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Marks Obtained</label>
                        <input type="number" name="marks" min="0" required>
                    </div>

                    <div class="field">
                        <label>Maximum Marks</label>
                        <input type="number" name="max_marks" value="100" min="1" required>
                    </div>

                    <div class="field full">
                        <label>Exam Date</label>
                        <input type="date" name="exam_date">
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">💾 Save Exam</button>
                    <a href="/exams/" class="btn btn-secondary">📋 View Exam List</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
