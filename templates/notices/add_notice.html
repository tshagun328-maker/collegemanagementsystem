<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Notice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 56px;
            color: #1e293b;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            font-size: 24px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 600;
            color: #334155;
        }

        input, textarea {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 25px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        .btn-list {
            background: #10b981;
            color: white;
        }

        .btn-list:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📢 Add Notice</h1>
        <p>Create and publish important notices for students and staff.</p>

        <form method="POST">
            {% csrf_token %}

            <label>Title</label>
            <input type="text" name="title" required>

            <label>Description</label>
            <textarea name="description" required></textarea>
            
            <div class="form-group mb-3">
                <label for="date" class="form-label">Date</label>
                <input
                    type="date"
                    name="date"
                    id="date"
                    class="form-control"
                    required
                    value="{% now 'Y-m-d' %}"
                >
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn btn-save">💾 Save Notice</button>
                <a href="{% url 'notice_list' %}" class="btn btn-list">📋 View Notices</a>
            </div>
        </form>
    </div>
</body>
</html>
