<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ student.name }}"><br><br>

    <label>Roll No:</label>
    <input type="text" name="roll_no" value="{{ student.roll_no }}"><br><br>

    <label>Course:</label>
    <input type="text" name="course" value="{{ student.course }}"><br><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="{% url 'student_list' %}">Back</a>

</body>
</html>
