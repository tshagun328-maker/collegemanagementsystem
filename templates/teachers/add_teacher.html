<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow-lg rounded-4">
                    <div class="card-header bg-primary text-white text-center rounded-top-4">
                        <h3 class="mb-0">Add Teacher</h3>
                    </div>

                    <div class="card-body p-4">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-bold">Teacher Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Enter teacher name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter teacher email" required>
                            </div>

                            <div class="mb-3">
                                <label for="phone">Phone Number</label>
                                <input
                                    type="text"
                                    name="phone"
                                    id="phone"
                                    class="form-control"
                                    placeholder="Enter Phone Number"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Subject</label>
                                <input type="text" name="subject" class="form-control" placeholder="Enter subject" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Joining Date</label>
                                <input type="date" name="joining_date" class="form-control" required>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success">
                                    Save Teacher
                                </button>

                                <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
                                    Back
                                </a>
                            </div>

                        </form>

                    </div>

                    <div class="card-footer text-center text-muted">
                        © 2026 College Management System
                    </div>

                </div>

            </div>
        </div>
    </div>

</body>
</html>
