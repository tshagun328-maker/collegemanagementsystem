<!DOCTYPE html>
<html>
<head>
    <title>Teacher List</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .btn {
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            color: white;
        }

        .btn-add {
            background: green;
            float: right;
        }

        .btn-edit {
            background: blue;
        }

        .btn-delete {
            background: red;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background: #007bff;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .back-btn {
            margin-top: 15px;
            display: inline-block;
            background: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Teacher List</h2>

    <a href="{% url 'add_teacher' %}" class="btn btn-add">+ Add Teacher</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Subject</th>
            <th>Actions</th>
        </tr>

        {% for t in teachers %}
        <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.name }}</td>
            <td>{{ t.email }}</td>
            <td>{{ t.phone }}</td>
            <td>{{ t.subject }}</td>
            <td>
                <a href="{% url 'edit_teacher' t.id %}" class="btn btn-edit">Edit</a>
                <a href="{% url 'delete_teacher' t.id %}" class="btn btn-delete"
                   onclick="return confirm('Are you sure you want to delete this teacher?')">
                   Delete
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No teachers found</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/student_dashboard/" class="btn back-btn">⬅ Back Dashboard</a>
</div>

</body>
</html>
