<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice List</title>
    
        <div style="
            max-width: 1450px;
            margin: 30px auto;
            background: #f8fafc;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        ">

            <!-- Heading -->
            <h1 style="
                font-size: 72px;
                font-weight: 800;
                color: #1e293b;
                margin-bottom: 30px;
                display: flex;
                align-items: center;
                gap: 20px;
            ">
                📋 Notice List
            </h1>

            <!-- Add Notice Button -->
            <a href="{% url 'add_notice' %}" style="
                display: inline-block;
                background: linear-gradient(135deg, #2563eb, #3b82f6);
                color: white;
                padding: 16px 32px;
                border-radius: 14px;
                text-decoration: none;
                font-size: 20px;
                font-weight: 600;
                margin-bottom: 30px;
                box-shadow: 0 8px 20px rgba(37,99,235,0.25);
            ">
                ➕ Add New Notice
            </a>

            <!-- Table -->
            <div style="
                overflow-x: auto;
                border-radius: 20px;
                background: white;
                box-shadow: 0 10px 30px rgba(0,0,0,0.06);
                margin-top: 20px;
            ">
                <table style="
                    width: 100%;
                    border-collapse: collapse;
                    font-size: 20px;
                ">
                    <thead>
                        <tr style="
                            background: linear-gradient(135deg, #3b82f6, #2563eb);
                            color: white;
                        ">
                            <th style="padding: 20px; text-align: center;">ID</th>
                            <th style="padding: 20px; text-align: left;">Title</th>
                            <th style="padding: 20px; text-align: left;">Description</th>
                            <th style="padding: 20px; text-align: center;">Date</th>
                            <th style="padding: 20px; text-align: center;">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for notice in notices %}
                        <tr style="
                            border-bottom: 1px solid #e5e7eb;
                            color: #1f2937;
                        ">
                            <!-- ID -->
                            <td style="padding: 22px; text-align: center;">
                                {{ notice.id }}
                            </td>

                            <!-- Title -->
                            <td style="padding: 22px; font-weight: 600;">
                                {{ notice.title }}
                            </td>

                            <!-- Description -->
                            <td style="padding: 22px;">
                                {{ notice.description }}
                            </td>

                            <!-- Date -->
                            <td style="padding: 22px; text-align: center;">
                                {{ notice.date|date:"M d, Y" }}
                            </td>

                            <!-- Actions -->
                            <td style="
                                padding: 22px;
                                text-align: center;
                                white-space: nowrap;
                            ">
                                <!-- Edit Button -->
                                <a href="{% url 'edit_notice' notice.id %}" style="
                                    display: inline-block;
                                    padding: 10px 22px;
                                    background: #3b82f6;
                                    color: white;
                                    text-decoration: none;
                                    border-radius: 10px;
                                    font-weight: 600;
                                    margin-right: 8px;
                                    box-shadow: 0 4px 10px rgba(59,130,246,0.25);
                                ">
                                    Edit
                                </a>

                                <!-- Delete Button -->
                                <a href="{% url 'delete_notice' notice.id %}"
                                onclick="return confirm('Are you sure you want to delete this notice?');"
                                style="
                                    display: inline-block;
                                    padding: 10px 22px;
                                    background: #ef4444;
                                    color: white;
                                    text-decoration: none;
                                    border-radius: 10px;
                                    font-weight: 600;
                                    box-shadow: 0 4px 10px rgba(239,68,68,0.25);
                                ">
                                    Delete
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" style="
                                padding: 40px;
                                text-align: center;
                                color: #6b7280;
                                font-size: 22px;
                            ">
                                No notices available.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- Back Button -->
            <a href="{% url 'admin_dashboard' %}" style="
                display: block;
                margin-top: 30px;
                background: #6b7280;
                color: white;
                text-align: center;
                padding: 16px;
                border-radius: 12px;
                text-decoration: none;
                font-size: 24px;
                font-weight: 600;
            ">
                ← Back to Dashboard
            </a>

        </div>
</body>
</html>
