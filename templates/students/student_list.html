<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }
        .table th {
            background-color: #0d6efd;
            color: white;
            text-align: center;
        }
        .table td {
            text-align: center;
        }
        .btn {
            border-radius: 10px;
        }
    </style>

</head>
<body>

<div class="container mt-5">

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-primary">Student List</h2>

            <a href="{% url 'add_student' %}" class="btn btn-success">
                + Add Student
            </a>
        </div>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% if students %}
                    {% for student in students %}
                    <tr>
                        <td>{{ student.id }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.roll_no }}</td>
                        <td>{{ student.course }}</td>
                        <td>
                            <a href="{% url 'edit_student' student.id %}" class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <a href="{% url 'delete_student' student.id %}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this student?');">
                                Delete
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="5" class="text-center text-danger fw-bold">
                            No students found
                        </td>
                    </tr>
                {% endif %}
            </tbody>
        </table>

        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary w-100">
            ⬅ Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
